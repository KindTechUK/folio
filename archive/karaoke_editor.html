<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript Review Editor — spike</title>
<style>
  :root {
    --bg:#0f1115; --panel:#171a21; --ink:#e6e8ec; --muted:#8b94a3;
    --accent:#c026d3; --active:#fde047; --activebg:#422006; --line:#262b35; --edit:#38bdf8;
  }
  * { box-sizing:border-box; }
  body { margin:0; font:16px/1.8 -apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { position:sticky; top:0; z-index:10; background:var(--panel); border-bottom:1px solid var(--line); padding:10px 16px; }
  .row { display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  .row + .row { margin-top:8px; }
  button, label.btn { background:#222734; color:var(--ink); border:1px solid var(--line);
           border-radius:8px; padding:6px 12px; cursor:pointer; font-size:14px; }
  button:hover, label.btn:hover { border-color:var(--accent); }
  button.primary { background:var(--accent); border-color:var(--accent); }
  input[type=file] { display:none; }
  .time { font-variant-numeric:tabular-nums; color:var(--muted); min-width:120px; }
  .speed-group button.on { background:var(--accent); border-color:var(--accent); }
  main { max-width:820px; margin:0 auto; padding:24px 16px 45vh; }
  .hint { color:var(--muted); font-size:13px; }
  .turn { margin:0 0 18px; padding-left:12px; border-left:3px solid var(--spk,#444); }
  .turn-head { display:flex; gap:10px; align-items:baseline; margin-bottom:2px; }
  .spk { font-weight:700; cursor:pointer; padding:1px 8px; border-radius:6px;
         background:var(--spk,#333); color:#fff; font-size:13px; }
  .spk:hover { outline:2px solid var(--active); }
  .ts { color:var(--muted); font-size:12px; font-variant-numeric:tabular-nums; }
  .body { }
  .sent { border-radius:6px; padding:1px 3px; transition:background .1s; }
  .sent:hover { background:#1b212c; box-shadow:inset 0 0 0 1px var(--line); }
  .sent.editing { display:block; background:#0b0d11; box-shadow:0 0 0 2px var(--edit); padding:6px 8px; cursor:text; outline:none; }
  .w { cursor:pointer; border-radius:4px; }
  .w:hover { background:#2a3140; }
  .w.played { color:#aeb6c4; }
  .w.active { background:var(--activebg); color:var(--active); }
  .empty { text-align:center; color:var(--muted); margin-top:18vh; }
  kbd { background:#222734; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
  #status { color:var(--edit); font-size:13px; min-width:180px; }
</style>
</head>
<body>
<header>
  <div class="row">
    <label class="btn" for="audio">🎵 Audio</label>
    <input id="audio" type="file" accept="audio/*,video/*">
    <label class="btn" for="json">📄 Transcript JSON</label>
    <input id="json" type="file" accept=".json,application/json">
    <button id="play" class="primary">▶︎ Play</button>
    <span class="time"><span id="cur">0:00</span> / <span id="dur">0:00</span></span>
    <div class="speed-group row" style="gap:4px">
      <span class="hint">speed</span>
      <button data-s="0.75">.75×</button><button data-s="1" class="on">1×</button>
      <button data-s="1.25">1.25×</button><button data-s="1.5">1.5×</button><button data-s="2">2×</button>
    </div>
    <button id="export">⬇︎ JSON</button>
    <button id="exporttxt">⬇︎ Script</button>
  </div>
  <div class="row">
    <span id="status">ready</span>
    <span class="hint">
      <kbd>Space</kbd> play/pause · <kbd>←→</kbd> ±2s · <b>click a word</b> = jump there ·
      <b>double-click a sentence</b> = edit text (<kbd>Enter</kbd> save, <kbd>Esc</kbd> cancel) ·
      click a <b>speaker</b> = rename everywhere
    </span>
  </div>
</header>

<main id="main"><div class="empty" id="empty">
  Load an audio file and its <code>.json</code> sidecar (the project's <code>.m4a</code> + <code>out/*.json</code>).
</div></main>

<audio id="player" preload="metadata"></audio>

<script>
const $ = s => document.querySelector(s);
const player = $('#player');
let words = [];        // document-order word objs: {el,start,end,speaker,word}
let starts = [];
let renameMap = {};
let activeIdx = -1, editing = false, editEl = null, editBackup = '';

const fmt  = s => { s=Math.max(0,s); const m=(s/60)|0; return m+':'+String((s%60)|0).padStart(2,'0'); };
const hue  = id => { let h=0; for(const c of (id||'')) h=(h*31+c.charCodeAt(0))%360; return h; };
const spkColor = id => `hsl(${hue(id)} 45% 38%)`;
const disp = id => renameMap[id ?? ''] || id || 'SPEAKER';
const status = m => $('#status').textContent = m;
const isEnd = w => /[.!?]["')\]]*$/.test(w);

// ---------- loading ----------
$('#audio').onchange = e => { const f=e.target.files[0]; if(!f) return;
  player.src=URL.createObjectURL(f); player.onloadedmetadata=()=>$('#dur').textContent=fmt(player.duration); };
$('#json').onchange = e => { const f=e.target.files[0]; if(!f) return;
  const r=new FileReader(); r.onload=()=>{ try{render(JSON.parse(r.result));}catch(x){alert('Bad JSON: '+x);} };
  r.readAsText(f); };

// ---------- build word spans / sentences / turns ----------
function makeWord(w){ const el=document.createElement('span'); el.className='w'; el.textContent=w.word+' '; el._w=w;
  w.el=el; el.onclick=ev=>{ if(editing) return; ev.stopPropagation(); player.currentTime=w.start; }; return el; }

function makeSentence(ws){ const sent=document.createElement('span'); sent.className='sent';
  sent.dataset.spk=ws[0]?.speaker ?? '';
  ws.forEach(w=>sent.append(makeWord(w)));
  sent.append(document.createTextNode(' '));
  sent.ondblclick=()=>editSentence(sent); return sent; }

function splitSentences(ws){ const out=[]; let cur=[];
  for(const w of ws){ cur.push(w); if(isEnd(w.word)){ out.push(cur); cur=[]; } }
  if(cur.length) out.push(cur); return out; }

function render(data){
  const segs = data.segments || (Array.isArray(data)?data:[]);
  renameMap={}; activeIdx=-1; editing=false; editEl=null;
  // 1) flat words with speaker
  const flat=[];
  for(const seg of segs){
    const ss = seg.speaker || (seg.words&&seg.words.find(w=>w.speaker)?.speaker) || null;
    const ws=(seg.words&&seg.words.length)?seg.words:[{word:seg.text,start:seg.start,end:seg.end,speaker:ss}];
    for(const w of ws){ const t=(w.word??w.text??'').trim(); if(!t) continue;
      flat.push({word:t, start:w.start??seg.start, end:w.end??w.start??seg.end, speaker:w.speaker||ss}); }
  }
  // 2) group consecutive speaker -> turns; 3) split into sentences
  const main=$('#main'); main.innerHTML=''; let i=0;
  while(i<flat.length){
    const spk=flat[i].speaker; const turnWords=[];
    while(i<flat.length && flat[i].speaker===spk){ turnWords.push(flat[i]); i++; }
    const turn=document.createElement('div'); turn.className='turn'; turn.style.setProperty('--spk',spkColor(spk));
    const head=document.createElement('div'); head.className='turn-head';
    const chip=document.createElement('span'); chip.className='spk'; chip.style.setProperty('--spk',spkColor(spk));
    chip.textContent=disp(spk); chip.dataset.spk=spk??''; chip.onclick=()=>renameSpeaker(spk);
    const ts=document.createElement('span'); ts.className='ts'; ts.textContent=fmt(turnWords[0].start);
    head.append(chip,ts);
    const body=document.createElement('div'); body.className='body';
    for(const sentWs of splitSentences(turnWords)) body.append(makeSentence(sentWs));
    turn.append(head,body); main.append(turn);
  }
  reindex(); status(`${words.length} words loaded`);
}

function reindex(){ words=[...document.querySelectorAll('.w')].map(el=>el._w); starts=words.map(w=>w.start); activeIdx=-1; }

// ---------- sentence editing (the only edit unit) ----------
function editSentence(sent){
  if(editing) return; editing=true; editEl=sent;
  const ws=[...sent.querySelectorAll('.w')].map(x=>x._w);
  sent._range = { s: ws.length?ws[0].start:player.currentTime,
                  e: ws.length?ws[ws.length-1].end:player.currentTime,
                  speaker: ws.length?ws[0].speaker:(sent.dataset.spk||null) };
  editBackup = ws.map(w=>w.word).join(' ');
  sent.textContent = editBackup;
  sent.classList.add('editing'); sent.contentEditable=true; sent.focus();
  const r=document.createRange(); r.selectNodeContents(sent); const sl=getSelection(); sl.removeAllRanges(); sl.addRange(r);
  status('editing — Enter to save, Esc to cancel');
}
function rebuild(sent, text){
  const {s,e,speaker}=sent._range; sent.innerHTML='';
  const toks=text.replace(/\s+/g,' ').trim().split(' ').filter(Boolean);
  if(!toks.length){ sent.remove(); return; }
  const span=(e-s>0)?(e-s):Math.max(0.3*toks.length,0.3), total=toks.join('').length||1; let acc=0;
  for(const tok of toks){ const st=s+span*(acc/total); acc+=tok.length; const en=s+span*(acc/total);
    sent.append(makeWord({word:tok,start:st,end:en,speaker})); }
  sent.append(document.createTextNode(' '));
}
function commitSentence(save){
  if(!editing||!editEl) return; const sent=editEl;
  sent.classList.remove('editing'); sent.contentEditable=false;
  rebuild(sent, save ? sent.textContent : editBackup);
  editing=false; editEl=null; reindex(); status(save?'saved':'cancelled');
}
document.addEventListener('focusout', e => { if(editing && e.target===editEl) commitSentence(true); });

// ---------- speaker rename (global; labels are positional) ----------
function renameSpeaker(orig){
  const name=prompt(`Rename “${disp(orig)}” everywhere as:`, disp(orig));
  if(name==null) return; renameMap[orig??'']=name.trim()||orig;
  document.querySelectorAll(`.spk[data-spk="${orig??''}"]`).forEach(c=>c.textContent=disp(orig));
}

// ---------- word highlighting (review only; not an edit surface) ----------
function activeAt(t){ let lo=0,hi=starts.length-1,a=-1;
  while(lo<=hi){const m=(lo+hi)>>1; if(starts[m]<=t){a=m;lo=m+1;}else hi=m-1;} return a; }
function tick(){
  if(!words.length) return; const t=player.currentTime; $('#cur').textContent=fmt(t);
  if(editing) return;
  const idx=activeAt(t);
  if(idx!==activeIdx){
    if(words[activeIdx]?.el) words[activeIdx].el.classList.replace('active','played');
    if(words[idx]?.el){ const el=words[idx].el; el.classList.add('active'); el.classList.remove('played');
      const r=el.getBoundingClientRect(); if(r.top<90||r.bottom>innerHeight-60) el.scrollIntoView({block:'center',behavior:'smooth'}); }
    activeIdx=idx;
  }
}
(function loop(){ tick(); requestAnimationFrame(loop); })();

// ---------- transport + keys ----------
$('#play').onclick=()=>player.paused?player.play():player.pause();
player.onplay =()=>$('#play').textContent='❚❚ Pause';
player.onpause=()=>$('#play').textContent='▶︎ Play';
document.querySelectorAll('.speed-group button').forEach(b=>b.onclick=()=>{
  player.playbackRate=parseFloat(b.dataset.s);
  document.querySelectorAll('.speed-group button').forEach(x=>x.classList.toggle('on',x===b)); });

document.addEventListener('keydown', e => {
  if(editing){ if(e.key==='Enter'&&!e.shiftKey){ e.preventDefault(); commitSentence(true); }
               else if(e.key==='Escape'){ e.preventDefault(); commitSentence(false); } return; }
  if(e.target.tagName==='INPUT') return;
  if(e.code==='Space'){ e.preventDefault(); player.paused?player.play():player.pause(); }
  else if(e.code==='ArrowRight') player.currentTime+=2;
  else if(e.code==='ArrowLeft')  player.currentTime-=2;
});

// ---------- export ----------
$('#export').onclick=()=>{ reindex();
  const out=words.map(w=>({word:w.el.textContent.trim(), start:+w.start.toFixed(3), end:+w.end.toFixed(3), speaker:disp(w.speaker)}));
  dl(JSON.stringify({words:out},null,2),'transcript_edited.json','application/json'); };
$('#exporttxt').onclick=()=>{ reindex(); let txt='',last=' ';
  for(const w of words){ const s=disp(w.speaker); if(s!==last){ txt+=`\n\n${s}  [${fmt(w.start)}]\n`; last=s; } txt+=w.el.textContent.trim()+' '; }
  dl(txt.trim()+'\n','transcript_edited.txt','text/plain'); };
function dl(c,n,t){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([c],{type:t})); a.download=n; a.click(); }
</script>
</body>
</html>
