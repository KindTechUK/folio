[package]
name = "kindtech-transcribe-app"
version = "0.3.0"
description = "Hardened, zero-egress local transcription app shell (Tauri v2)."
edition = "2021"
license = "Apache-2.0"
default-run = "kindtech-transcribe-app"

# The library that Tauri's mobile/desktop entrypoints share.
[lib]
name = "kindtech_transcribe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ed25519-dalek = { version = "2", features = ["pem"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pem"] }

[dependencies]
# In-process engine via a PATH dependency — NOT a registry fetch. Pulls
# sherpa-onnx in transitively.
engine = { path = "../../engine" }

# Model-pack verification crate via a PATH dependency — network-free; scanned
# by scripts/check-no-network.sh.
modelpack = { path = "../../modelpack" }

# Tauri v2 with ONLY the plugins this app needs. Deliberately ABSENT (the
# product's zero-egress differentiator):
#   tauri-plugin-http, tauri-plugin-updater, tauri-plugin-aptabase,
#   tauri-plugin-deep-link, and any HTTP client (reqwest/ureq/hyper/isahc/surf).
# scripts/check-no-network.sh (run by .github/workflows/ci.yml) enforces this.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Already in the tree through `engine`. Carries the speaker step's errors.
anyhow = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Verified-pack resolution: extract verified packs' `weights.bin` zips into a
# content-addressed cache. Network-free (scanned by the zero-egress gate).
zip = "2"
sha2 = "0.10"

# In-app recording: microphone capture (CoreAudio / WASAPI / ALSA backends),
# WAV writing, and local-time file names. All network-free.
cpal = "0.18.2"
hound = "3.5"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

# "This computer" card: memory size and processor name. Network-free.
sysinfo = { version = "0.33", default-features = false, features = ["system"] }

[features]
# Both are network-free. Release builds set `hardened` (release.yml); it is
# reserved to compile OUT any future optional networked feature. The CI gate
# runs `cargo tree` for default AND `--features hardened`.
default = []
hardened = []

# Reading whether the microphone offers raw capture (src/microphone.rs). The
# same `windows` version cpal already uses, so nothing new is built.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Media_Audio",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Variant",
  "Win32_UI_Shell_PropertiesSystem",
] }

# Reading whether the default microphone is built in (src/microphone.rs). The
# same Core Audio bindings cpal already uses, so nothing new is built.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"] }
