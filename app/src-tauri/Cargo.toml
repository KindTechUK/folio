[package]
name = "kindtech-transcribe-app"
version = "0.2.0"
description = "Hardened, zero-egress local transcription app shell (Tauri v2)."
edition = "2021"
license = "Apache-2.0"
default-run = "kindtech-transcribe-app"

# The library that Tauri's mobile/desktop entrypoints share.
[lib]
name = "kindtech_transcribe_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
ed25519-dalek = { version = "2", features = ["pem"] }

[dev-dependencies]
ed25519-dalek = { version = "2", features = ["pem"] }

[dependencies]
# In-process engine (committed in PR1) via a PATH dependency — NOT a network
# crate, NOT a registry fetch. This pulls sherpa-onnx in transitively and is
# what we link the app against.
engine = { path = "../../engine" }

# Model-pack verification crate (PR #3a) via a PATH dependency — network-free
# (ed25519-dalek/sha2/serde). PR #3c wires it at the trust boundary so the app
# verifies signed packs before trusting/importing them. The zero-egress gate
# already scans modelpack (scripts/check-no-network.sh).
modelpack = { path = "../../modelpack" }

# Tauri v2 with ONLY the plugins this app needs. Deliberately ABSENT (the
# product's zero-egress differentiator — see docs/plans/vibe-fork-plan.md §4):
#   tauri-plugin-http, tauri-plugin-updater, tauri-plugin-aptabase,
#   tauri-plugin-deep-link, and any HTTP client (reqwest/ureq/hyper/isahc/surf).
# scripts/check-no-network.sh + .github/workflows/zero-egress.yml enforce this.
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Verified-pack resolution (PR #3d): extract verified packs' `weights.bin` zips
# into a content-addressed cache and SHA-256 the manifest set for the cache key.
# Both are network-free (the zero-egress gate scans this manifest).
zip = "2"
sha2 = "0.10"

[features]
# Both are network-free. Release builds set `hardened` (release.yml); it is
# reserved to compile OUT any future optional networked feature. The CI gate
# runs `cargo tree` for default AND `--features hardened`.
default = []
hardened = []
