[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "In-process, CPU-only ASR + speaker diarization engine wrapping the official k2-fsa sherpa-onnx Rust crate, emitting the project's JSON transcript contract."
license = "Apache-2.0"

[dependencies]
# Official k2-fsa sherpa-onnx Rust wrapper (NOT the deprecated `sherpa-rs`).
# `static` (default) links the prebuilt C libs statically; the sherpa-onnx-sys
# build script downloads them on first build unless SHERPA_ONNX_LIB_DIR is set.
# See README.md for the offline / Windows vendoring path.
sherpa-onnx = { version = "1.13.2", default-features = false, features = ["static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
hound = "3.5"

[dev-dependencies]
