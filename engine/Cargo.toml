[package]
name = "engine"
version = "0.1.0"
edition = "2021"
description = "In-process, CPU-only ASR + speaker diarization engine wrapping the official k2-fsa sherpa-onnx Rust crate, emitting the project's JSON transcript contract."
license = "Apache-2.0"

[dependencies]
# Official k2-fsa sherpa-onnx Rust wrapper (NOT the deprecated `sherpa-rs`).
# `static` (default) links the prebuilt C libs statically; the sherpa-onnx-sys
# build script downloads them on first build unless SHERPA_ONNX_LIB_DIR is set.
# See README.md for the offline / Windows vendoring path.
sherpa-onnx = { version = "=2.0.1", default-features = false, features = ["static"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "2.0"
hound = "3.5"

# Pure-Rust audio decode (mp3 / AAC-in-M4A / FLAC / WAV / MP4 demux) — keeps the
# single auditable binary (no bundled ffmpeg). `rubato` does the 16 kHz resample.
# Both are codec/DSP crates with NO network deps (scripts/check-no-network.sh).
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "isomp4", "flac", "wav", "pcm", "ogg", "vorbis"] }
rubato = "0.16"

[dev-dependencies]
