# Release pipeline — triggered by pushing a version tag (e.g. v0.1.0).
#
# Produces, on the GitHub Release for the tag:
#   • signed model packs  (asr-parakeet-tdt-0.6b-v2, asr-whisper-small.en,
#     asr-whisper-medium.en, diarization-pyannote-campplus) + SHA256SUMS
#   • desktop installers for macOS (.dmg), Windows (.exe), Linux (.AppImage/.deb)
#
# The app and the packs share ONE ed25519 keypair (see docs/model-packs.md):
#   • secrets.MODELPACK_SIGNING_KEY  — PKCS8 private PEM, signs the packs.
#   • secrets.VENDOR_PUBKEY_SPKI_PEM — matching SPKI public PEM, compiled into the
#     app (option_env! in app/src-tauri/src/models.rs) so it trusts those packs.
# The release is built as a DRAFT and published only after every asset lands.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    name: tests
    uses: ./.github/workflows/ci.yml

  create-release:
    name: create draft release
    runs-on: ubuntu-latest
    needs: ci
    steps:
      - uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          generate_release_notes: true

  model-packs:
    name: build + sign model packs
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Write vendor signing key
        env:
          MODELPACK_SIGNING_KEY: ${{ secrets.MODELPACK_SIGNING_KEY }}
        run: |
          test -n "$MODELPACK_SIGNING_KEY" || { echo "MODELPACK_SIGNING_KEY is required" >&2; exit 1; }
          umask 077
          printf '%s\n' "$MODELPACK_SIGNING_KEY" > "$RUNNER_TEMP/private.pkcs8.pem"
      - name: Build + sign packs
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          # Strip a leading "v" from the tag for the semver pack version.
          export VERSION="${VERSION#v}"
          export KEY="$RUNNER_TEMP/private.pkcs8.pem"
          export OUT="$GITHUB_WORKSPACE/dist-packs"
          bash scripts/build-model-packs.sh
      - name: Upload packs to release
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            dist-packs/*.zip
            dist-packs/SHA256SUMS

  app:
    name: build app (${{ matrix.platform }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            bundles: app/src-tauri/target/release/bundle/dmg/*.dmg
          - platform: windows-latest
            bundles: app/src-tauri/target/release/bundle/nsis/*.exe
          - platform: ubuntu-latest
            bundles: |
              app/src-tauri/target/release/bundle/appimage/*.AppImage
              app/src-tauri/target/release/bundle/deb/*.deb
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # Install the frontend deps (incl. @tauri-apps/cli) so `npm run tauri build`
      # — which tauri-action invokes — can find the `tauri` binary. Without this
      # the build dies with "tauri: command not found" (exit 127).
      - name: Install frontend deps
        working-directory: app
        run: npm ci
      - name: Install Linux bundling deps
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            libgtk-3-dev patchelf
      # Build the installers. No tagName is passed, so tauri-action only BUILDS
      # (it does not manage the release); we attach the bundles ourselves below so
      # they land on the single draft release alongside the model packs.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Compile the real vendor public key into the app so it trusts the
          # packs signed in the model-packs job. build.rs fails release builds
          # if this is empty or equal to the committed development/test key.
          VENDOR_PUBKEY_SPKI_PEM: ${{ secrets.VENDOR_PUBKEY_SPKI_PEM }}
        with:
          projectPath: app
          args: --features hardened
      - name: Upload installers to release
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          fail_on_unmatched_files: true
          files: ${{ matrix.bundles }}

  publish-release:
    name: publish release
    runs-on: ubuntu-latest
    needs: [model-packs, app]
    steps:
      - name: Flip draft → published
        uses: softprops/action-gh-release@28ab305d0ffa26d60ec4bd614126329e26c7a0ec # v3.0.4
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
