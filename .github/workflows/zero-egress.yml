# Zero-egress assurance CI.
#
# This workflow is LIVE: it runs on every push and currently passes on Linux
# (gate + frontend + modelpack) and a real Windows x64 runner (MSVC static-link).
# The gate is also provable locally any time via scripts/check-no-network.sh.
#
# Three jobs:
#   1. gate         — the network-crate denylist gate (the heart of PR2).
#   2. windows-link — validates MSVC static linking of sherpa-onnx for engine +
#                     app (the PR1-deferred Windows risk; not runnable on the
#                     mac dev host).
#   3. frontend     — npm ci && npm run build for the React/Vite frontend.
name: zero-egress

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  gate:
    name: network-crate gate (cargo tree denylist)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # SHERPA_ONNX_LIB_DIR is NOT set here on purpose: `cargo tree` resolves the
      # dependency graph from manifests/lockfiles WITHOUT building, so no
      # sherpa-onnx C-lib download happens. The gate inspects linked crates only.
      - name: Run zero-egress gate
        run: bash scripts/check-no-network.sh

  windows-link:
    name: windows MSVC static-link (engine + app)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      # Vendored sherpa-onnx Windows static libs make the build provably offline.
      # Point SHERPA_ONNX_LIB_DIR at the unpacked
      # `sherpa-onnx-vX-win-x64-static-lib/lib` dir (see engine/README.md). Until
      # the vendored libs are wired into CI artifacts/cache, the build script
      # performs its one-time BUILD-TIME fetch (not runtime egress).
      # env:
      #   SHERPA_ONNX_LIB_DIR: ${{ github.workspace }}\vendor\sherpa-onnx\lib
      - name: Build engine (MSVC static link)
        run: cargo build --manifest-path engine/Cargo.toml
      # tauri-build embeds frontendDist (../dist) at compile time, and
      # beforeBuildCommand only runs under `tauri build` — so the dist must be
      # built explicitly before a plain `cargo build` of the Tauri backend.
      - name: Build frontend (so tauri-build can embed dist)
        working-directory: app
        run: npm ci && npm run build
      - name: Build app backend (engine + sherpa-onnx linked into Tauri)
        run: cargo build --manifest-path app/src-tauri/Cargo.toml

  modelpack:
    name: modelpack verify (cross-language conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The standalone model-pack verification crate (no workspace). Its
      # tests/conformance.rs reads the shared fixtures under fixtures/modelpack/
      # and asserts identical trust decisions to the TS oracle.
      - name: Run modelpack tests
        run: cargo test --manifest-path modelpack/Cargo.toml

  modelpack-sign:
    name: modelpack-sign (producer signer conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # The vendor-side producer CLI (standalone crate, not shipped). It links
      # NO sherpa-onnx, so it builds/tests on plain ubuntu. Its cross-tool test
      # proves the Rust signer reproduces the committed TS-generated signature
      # byte-for-byte (signer never drifts from the in-app verifier).
      - name: Run modelpack-sign tests
        run: cargo test --manifest-path tools/modelpack-sign/Cargo.toml

  frontend:
    name: frontend build (React + Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build
      - run: npx vitest run
